name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create package.json
        run: |
          echo '{"name":"huntergame","version":"1.0.0","dependencies":{"@capacitor/core":"^6.0.0","@capacitor/android":"^6.0.0"},"devDependencies":{"@capacitor/cli":"^6.0.0"}}' > package.json

      - name: Create capacitor.config.ts
        run: |
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.hunter.game', appName: 'HunterGame', webDir: 'www', plugins: { WebSocketServer: { port: 8080 } }, android: { allowMixedContent: true } }; export default config;" > capacitor.config.ts

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install WebSocket Server Plugin
        run: npm install cordova-plugin-websocket-server

      - name: Copy web assets
        run: npx cap copy

      - name: Update Android platform
        run: npx cap update android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HunterGame-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
